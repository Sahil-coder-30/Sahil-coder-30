  </defs>
  
  <rect width="854" height="220" fill="#0D1117"/>

  <g transform="translate(427, 110) scale(1, 1) translate(-427, -110)">
    <path d="M0,160 C150,210 350,110 500,160 C650,210 750,130 854,150 L854,220 L0,220 Z" fill="url(#linear)" opacity="0.6" />
    <path d="M0,175 C200,140 380,210 550,170 C700,130 800,190 854,175 L854,220 L0,220 Z" fill="#16213e" opacity="0.4" />
  </g>

  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="34%" class="text" fill="#F1F5F9">SAHIL SHARMA</text>
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="58%" class="role" fill="#818CF8">AI-Native Software Engineer &amp; Systems Architect</text>
  <text text-anchor="middle" dominant-baseline="middle" x="50%" y="76%" class="desc" fill="#94A3B8">GenAI • AWS (EKS, ECS, EC2) • Kubernetes • MERN • PostgreSQL</text>
