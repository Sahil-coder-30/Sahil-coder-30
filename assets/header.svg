<svg
  width="854"
  height="220"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 220"
>
  <style>
    .text { font-size: 64px; font-weight: 800; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; letter-spacing: 2px; }
    .role { font-size: 18px; font-weight: 600; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; letter-spacing: 1px; }
    .desc { font-size: 14px; font-weight: 500; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; opacity: 0.85; }
    .text, .role, .desc { animation: fadeIn 1.2s ease-in-out forwards; }
